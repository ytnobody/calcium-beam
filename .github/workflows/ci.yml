name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"

      - run: go build ./...
      - run: go test ./pkg/... ./cmd/...

  # Stage 6: differential corpus against the pinned reference calcium-lang
  # (see docs/DECISIONS.md D13/D17/D18). The full corpus matches as of D18
  # (core.array auto-linking) - a real gate now, not continue-on-error.
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"

      - run: go test ./tests/differential/... -v
